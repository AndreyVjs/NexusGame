name: Verificar NexusGame

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar código e recursos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar JavaScript e estrutura do projeto
        run: npm run check
